<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>level2</title>
</head>
<body>
  <h1>Level 2 Activity: User Validator & Day Helper</h1>
  
  <label> Enter Age: </label>
  <input type="text" id="ageInput"></input>
  <button id="ageSubmit">Submit</button>
  <h2 id="ageResult"></h2>

  <label>Enter a Number: </label>
  <input id="numberInput"></input>
  <button id="submitNumber">Submit</button>
  <h2 id="numberResult"></h2>

  <label>Enter GPA: </label>
  <input id="gpaInput"></input>
  <button id="checkGPA">Check GPA</button>
  <h2 id="gpaResult"></h2>

  <label>Check Day: </label>
  <input type="text" id="inputWeek"></input>
  <button id="checkWeek">Check Day</button>
  <h2 id="weekResult"></h2>

  <label>Check Password Strength: </label>
  <input type="password" id="inputPass"></input>
  <button id="checkPass">Check Password</button>
  <h2 id="passResult"></h2>

  <label>Enter a number:</label>
  <input id="sNumber"></input>
  <button id="checkNumber">Check Number</button>
  <h2 id="sNumberResult"></h2>

  <script src="level2.js"></script>
</body>
</html>
