<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 8 Beginner Projects</title>
  <link rel="stylesheet" href="level8.css">
</head>
<body>
  <h1>Welcome to Different Beginner Projects</h1>
  <label>Temparature Converter (°C ↔ °F)</label><br>
  <input type="text" placeholder="Input here" id="inputTemp">
  <label id="converter"></label><br>
  <button id="CelsiusBtn">Convert To Celsius</button>
  <button id="Fahrenheit">Convert To fahrenheit</button><br><br>

  <!--This is the calculator section-->
  <label>Calculator</label><br>
  <input type="text" id="input"><br>
  <button value='1'>1</button>
  <button value='2'>2</button>
  <button value='3'>3</button>
  <button value='4'>4</button>
  <button value='5'>5</button><br>
  <button value='6'>6</button>
  <button value='7'>7</button>
  <button value='8'>8</button>
  <button value='9'>9</button>
  <button value='0'>0</button><br>

  <button id="add" value='+'>+</button>
  <button id="minus" value='-'>-</button>
  <button id="times" value='x'>x</button>
  <button id="divide" value='÷'>&#247;</button>

  <button id="equal">=</button>
  <button id="clear">C</button><br><br>

  <!-- Random Number Generator -->
  <label>Random Number Generator</label><br>
  <button id="randomBtn">Generate</button><br>
  <p id="randomOutput"></p><br>

  <!-- Guessing Game -->
  <label>Guessing Game</label><br>
  <input type="text" id="guessInput" placeholder="Enter your guess">
  <button id="guessBtn">Submit Guess</button>
  <p id="guessOutput"></p>

  <!-- Character Counter -->
  <label>Character Counter</label><br>
  <textarea id="CharCountInput" placeholder="Enter text here"></textarea>
  <button id="charCountBtn">Count Characters</button><br>
  <p id="CharCountOutput"></p>

  <script src="level8.js"></script>
</body>
</html>
